[project]
name = "lambda-coding-agent"
version = "0.1.0"
description = "A practical coding agent CLI built with Textual and SimpleLLMFunc"
authors = [
    {name = "NiJinghe"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "simplellmfunc (==0.8.1)",
    "textual (==8.2.2)"
]

[project.scripts]
lambda-agent = "lambda_coding_agent.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
textual-dev = "^1.8.0"


[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
